<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio & Case Studies | Shane Hennessy</title>
    <meta name="title" content="Portfolio & Case Studies | Shane Hennessy">
    <meta name="description" content="Explore UI/UX design, web development, and graphic design projects by Shane Hennessy, including interactive JavaScript applications and accessible design systems.">
    <link rel="canonical" href="https://www.hennessyshane.com/portfolio.html">

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.hennessyshane.com/portfolio.html">
    <meta property="og:title" content="Portfolio & Case Studies | Shane Hennessy">
    <meta property="og:description" content="Explore UI/UX design, web development, and graphic design projects by Shane Hennessy.">
    <meta property="og:image" content="https://www.hennessyshane.com/assets/thumbnails/og-preview.png">

    <!-- X (Twitter) Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.hennessyshane.com/portfolio.html">
    <meta name="twitter:title" content="Portfolio & Case Studies | Shane Hennessy">
    <meta name="twitter:description" content="Explore UI/UX design, web development, and graphic design projects by Shane Hennessy.">
    <meta name="twitter:image" content="https://www.hennessyshane.com/assets/thumbnails/og-preview.png">
</head>
<body>

    <!-- 1. Navigation Bar -->
    <header>
        <div id="nav-placeholder"></div>
    </header>

    <!-- 2. Hero Area -->
    <section id="interior" class="banner">
        <div class="banner-content">
            <h1>Collection of Works</h1>
            <p>An evergrowing list of digital projects ranging from UI / UX applcation designs & development, and other digital media.</p>
        </div>
    </section>

    <!-- 3. Portfolio Grid -->
    <section id="portfolio" class="content">
      <h2 id="portfolio-heading">All Projects</h2>

      <!-- Your existing 3x2 CSS Grid container -->
      <div class="portfolio-grid" id="portfolio-grid"></div>
        <!-- Reusable Card Template -->
        <template id="portfolio-card-template">
          <article class="portfolio-card">
            <div class="card-media" role="img" aria-label=""></div>
            <div class="card-content">
              <ul class="card-tags" aria-label="Project categories"></ul>
              <h3 class="card-title"></h3>
              <p class="card-description"></p>
              <div class="card-actions">
                <a href="" class="btn btn-primary" target="_blank" rel="noopener noreferrer"></a>
                <a href="" class="btn btn-secondary" target="_blank" rel="noopener noreferrer"></a>
              </div>
            </div>
          </article>
        </template>
        <button type="page-button" class="text-btn"><a href="./contact.html" rel="noopener noreferrer">GET IN CONTACT</a></button>
    </section>

    <!-- 4. Footer -->
    <footer id="contact">
       <div id="footer-placeholder"></div>
    </footer>
<script type="module" src="./main.js"></script>
</body>
</html>
