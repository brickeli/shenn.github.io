<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shane Hennessy Portfolio | UI/UX & Design Research Development</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- 1. Navigation Bar -->
    <header>
        <div id="nav-placeholder"></div>
    </header>

    <!-- 2. Hero Area -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Curating Custom Digital Experiences</h1>
            <p>Showcasing UI/UX design, functional web applications, and visual branding.</p>
        </div>
    </section>

    <!-- 3. Portfolio Grid -->
    <section id="portfolio" class="portfolio-section">
        <h2>Featured Works</h2>
        <div class="portfolio-grid" id="portfolio-grid" data-featured-only="true"></div>
        <!-- Reusable Card Template -->
        <template id="portfolio-card-template">
          <article class="portfolio-card">
            <div class="card-media" role="img" aria-label=""></div>
            <div class="card-content">
              <ul class="card-tags" aria-label="Project categories"></ul>
              <h3 class="card-title"></h3>
              <p class="card-description"></p>
              <div class="card-actions">
                <a href="" class="btn btn-primary" target="_blank" rel="noopener noreferrer"></a>
                <a href="" class="btn btn-secondary" target="_blank" rel="noopener noreferrer"></a>
              </div>
            </div>
          </article>
        </template>
      </section>

    <!-- 4. Footer -->
    <footer id="contact">
       <div id="footer-placeholder"></div>
    </footer>
<script type="module" src="./main.js"></script>
</body>
</html>
